[build-system]
requires = ['setuptools>=64']
build-backend = 'setuptools.build_meta'

[project]
name = 'pote'
dynamic = ['version']
description = 'Python helpers, utils or code not worthy ot its own repo'
readme = 'README.md'
requires-python = '>=3.11'
license = {text = 'Apache-2.0'}
authors = [{name = 'Spikey', email = 'civvic@gmail.com'}]
keywords = ['python', 'nbdev', 'jupyter', 'notebook', 'javascript']
classifiers = ['Natural Language :: English', 'Intended Audience :: Developers', 'Development Status :: 3 - Alpha', 'Programming Language :: Python :: 3', 'Programming Language :: Python :: 3 :: Only']
dependencies = ['fastcore>=2.1.16', 'rich>=14.3.3']

[project.urls]
Repository = 'https://github.com/civvic/pote'
Documentation = 'https://civvic.github.io/pote'

[project.entry-points.nbdev]
pote = 'pote._modidx:d'

[project.optional-dependencies]
loguru = ['loguru']
dialoghelper = ['dialoghelper']
pyflakes = ['pyflakes']
ipywidgets = ['ipywidgets', 'jupyter_ui_poll']
dev = ['notebook', 'jupyterlab', 'nbclassic', 'nbdev', 'reorder-python-imports', "pysym2md", "llms-txt"]
all = ['pote[loguru,dialoghelper,pyflakes,ipywidgets,dev]']

[tool.setuptools.dynamic]
version = {attr = 'pote.__version__'}

[tool.setuptools.packages.find]
include = ['pote']

[project.entry-points.pyskills]
"pote.user_ws" = "pote.user_ws"
"pote.server" = "pote.server"
"pote.dialog" = "pote.dialog"
"pote.dlg2pyskill" = "pote.dlg2pyskill"
"pote.flakes" = "pote.flakes"

[tool.nbdev]
allowed_metadata_keys = ['solveit']
allowed_cell_metadata_keys = ['solveit_ai', 'pinned', 'skipped', 'heading_collapsed', 'collapsed', 'bookmark', 'hidden']
