project:
  type: website
  resources:
    - "*.txt"
    - "!static/"

  pre-render:
    - pysym2md --output_file apilist.txt pote
  post-render:
    - llms_txt2ctx llms.txt --optional true --save_nbdev_fname llms-ctx-full.txt
    - llms_txt2ctx llms.txt --save_nbdev_fname llms-ctx.txt

  render:
    - "*.ipynb"
    - "!*_dup*.ipynb"
    - "!data/"
    - "!test_disclose.ipynb"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    keep-md: true
  commonmark: default

website:
  twitter-card: true
  open-graph: true
  repo-actions: [issue]
  navbar:
    background: primary
    search: true
  sidebar:
    style: floating

metadata-files: [nbdev.yml, sidebar.yml]