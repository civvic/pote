project:
  pre-render:
    - pysym2md --output_file apilist.txt your_library_name
  post-render:
    - llms_txt2ctx llms.txt --optional true --save_nbdev_fname llms-ctx-full.txt
    - llms_txt2ctx llms.txt --save_nbdev_fname llms-ctx.txt
  resources:
    - "*.txt"

  render:
    - "*.ipynb"
    - "!*_dup*.ipynb"
    - "!data/"
    - "!static/"
    - "!02_git.ipynb"


